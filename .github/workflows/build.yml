name: Build and push APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Find APK and copy to ./build/z-ai-app.apk
      run: |
        mkdir -p build
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk build/z-ai-app.apk
          echo "Copied app-release.apk"
        else
          apk_path=$(find . -type f -name "*release*.apk" | head -n 1 || true)
          if [ -n "$apk_path" ]; then
            cp "$apk_path" build/z-ai-app.apk
            echo "Copied $apk_path"
          else
            echo "No release APK found"
            exit 1
          fi
        fi

    - name: Commit APK back to repo
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add build/z-ai-app.apk || true
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "chore(ci): add built APK (z-ai-app.apk) [skip ci]"
        git push origin HEAD:refs/heads/${{ github.ref_name }}
