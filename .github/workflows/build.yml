name: Build APK (release, fallback to debug) and upload artifact

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/android-sdk
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Print project layout (for debugging)
      run: |
        echo "Root files:"
        ls -la
        echo "Find build files and wrappers:"
        find . -maxdepth 4 -type f \( -name 'gradlew' -o -name 'build.gradle*' -o -name 'settings.gradle*' \) -print || true

    - name: Make gradlew executable if present
      run: |
        if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
        # make any gradlew found under subdirs executable too
        find . -type f -name gradlew -exec chmod +x {} \; || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android SDK command-line tools and platforms
      run: |
        set -e
        mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
        # Move to expected layout
        mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
        mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools"/* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/" || true
        export PATH="$PATH:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    - name: Attempt release build (use wrapper if available, else gradle)
      shell: bash
      run: |
        set -e
        # Decide which gradle command to use
        if [ -x ./gradlew ]; then
          echo "Using gradlew at repo root"
          GRADLE_CMD="./gradlew"
        else
          # Look for gradlew in subdirs
          gw=$(find . -type f -name gradlew | head -n 1 || true)
          if [ -n "$gw" ]; then
            echo "Using gradlew found at $gw"
            chmod +x "$gw"
            GRADLE_CMD="$gw"
          else
            echo "No gradlew found. Will use system gradle via gradle wrapper action fallback."
            GRADLE_CMD="gradle"
          fi
        fi

        # Try release build. If it fails, do not stop the job here; fall back later.
        set +e
        if [ "$GRADLE_CMD" = "gradle" ]; then
          # install gradle (system) if needed
          if ! command -v gradle >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gradle
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          RC=$?
        else
          $GRADLE_CMD :app:assembleRelease --no-daemon --stacktrace
          RC=$?
        fi
        set -e

        if [ $RC -ne 0 ]; then
          echo "Release build failed (exit $RC). Falling back to debug build."
          if [ "$GRADLE_CMD" = "gradle" ]; then
            gradle :app:assembleDebug --no-daemon --stacktrace
          else
            $GRADLE_CMD :app:assembleDebug --no-daemon --stacktrace
          fi
        fi

    - name: Find APK and copy to ./build/z-ai-app.apk
      run: |
        mkdir -p build
        # prefer release APK if present
        apk=$(find . -type f -path "*/app/build/outputs/apk/*/*/*.apk" | grep -i release | head -n1 || true)
        if [ -z "$apk" ]; then
          apk=$(find . -type f -path "*/app/build/outputs/apk/*/*/*.apk" | head -n1 || true)
        fi
        if [ -n "$apk" ]; then
          echo "Found APK: $apk"
          cp "$apk" build/z-ai-app.apk
          ls -lh build/z-ai-app.apk
        else
          echo "No APK found."
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: z-ai-app-apk
        path: build/z-ai-app.apk

    # Optional: commit APK back into repo (uncomment if you really want this)
